name: Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name shown to users, e.g. 1.0.1'
        required: true
        default: '1.0.1'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # The keystore never enters the repository. It is base64-encoded into a
      # repository secret and restored here, then fed to Gradle through
      # android/keystore.properties, which is gitignored.
      #
      # The password is passed via the environment rather than interpolated into
      # the shell command, because this step's command line is visible in the log.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > android/release.keystore
          {
            echo "releaseStoreFile=release.keystore"
            echo "releaseStorePassword=$KEYSTORE_PASSWORD"
            echo "releaseKeyAlias=$KEY_ALIAS"
            echo "releaseKeyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          # Fail loudly here rather than midway through a Gradle build.
          test -s android/release.keystore

      # expo-constants reads NODE_ENV and falls back to a partial config when it
      # is unset, which produces a subtly broken bundle.
      - name: Build release APK
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          cd android
          # The repository was authored on Windows, which does not carry the
          # executable bit, so gradlew lands on the runner as 644 and cannot be
          # invoked directly. Fixing it here rather than in the index keeps the
          # commit reproducible from either platform.
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PappVersionCode="${{ github.run_number }}" \
            -PappVersionName="${{ inputs.versionName || '1.0.0' }}" \
            --no-daemon

      - name: Verify the APK is signed by the release key
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" \
            | grep -E "^package:" | grep -q "versionCode='${{ github.run_number }}'"
          # A debug-signed APK would be uninstallable-as-an-update later, so this
          # is worth failing the build over rather than discovering on the phone.
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
              | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the DEBUG key, not the release key"
            exit 1
          fi
          echo "APK signed and versioned correctly"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: work-tracker-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Attach to a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
