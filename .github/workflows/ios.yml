name: iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Marketing version, e.g. 1.0.1'
        required: true
        default: '1.0.1'
      upload:
        description: 'Upload to TestFlight'
        type: boolean
        required: false
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload to TestFlight
    # macos-15 carries several Xcodes, from 16.3 up to 26.3. The default is the
    # oldest of them, which is why the step below selects one explicitly rather
    # than trusting xcode-select. Moving to macos-26 later is safe and needs no
    # change here beyond the IOS_XCODE_VERSION default.
    runs-on: macos-15
    timeout-minutes: 60

    env:
      # Must match expo.ios.bundleIdentifier in app.json. The provisioning
      # profile is checked against this below, because a mismatch surfaces
      # inside xcodebuild as an opaque signing error rather than as a wrong id.
      APP_BUNDLE_ID: com.sbxworktracker.app

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The image default is Xcode 16.4, whose Swift is 6.1. Expo SDK 57 pulls
      # in a Swift package that declares swift-tools-version 6.2, so the archive
      # died with "package 'apple' is using Swift tools version 6.2.0 but the
      # installed version is 6.1.0", eight minutes into a run with no hint that
      # the toolchain was the cause. Xcode 26 is already on the image, it just is
      # not the default, so it is selected here.
      #
      # The version is a repository variable rather than a literal so a future
      # image update does not need a code change, and so the error below can
      # print the versions that are actually installed.
      - name: Select Xcode
        env:
          WANT: ${{ vars.IOS_XCODE_VERSION || '26.3' }}
        run: |
          set -euo pipefail
          echo "image default: $(xcodebuild -version | head -n1)"

          FOUND=""
          for APP in /Applications/Xcode*.app; do
            [ -d "$APP" ] || continue
            V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$APP/Contents/Info.plist" 2>/dev/null || echo "")
            [ -n "$V" ] || continue
            echo "  available: Xcode $V"
            [ "$V" = "$WANT" ] && FOUND="$APP"
          done

          if [ -z "$FOUND" ]; then
            echo "::error::Xcode $WANT is not on this image."
            echo "::error::Set the IOS_XCODE_VERSION repository variable to one of the versions listed above."
            exit 1
          fi
          sudo xcode-select -s "$FOUND"
          echo "selected: $FOUND"
          xcodebuild -version

          # Confirm the Swift that xcode-select just switched to really is new
          # enough, so the failure lands here as one line rather than inside the
          # package resolution. An unrecognised banner only warns: refusing to
          # build because a version string changed shape would be worse than
          # letting the build decide for itself.
          BANNER=$(swift --version 2>&1 | head -n1)
          echo "swift: $BANNER"
          SWIFT=$(printf '%s\n' "$BANNER" | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p' | head -n1)
          if [ -z "$SWIFT" ]; then
            echo "::warning::could not read a Swift version from that banner, leaving it to the build"
          else
            MAJOR=${SWIFT% *}; MINOR=${SWIFT#* }
            echo "swift $MAJOR.$MINOR"
            if [ "$MAJOR" -lt 6 ] || { [ "$MAJOR" -eq 6 ] && [ "$MINOR" -lt 2 ]; }; then
              echo "::error::Swift $MAJOR.$MINOR is older than the 6.2 this build needs"
              echo "::error::Xcode $WANT was selected but does not provide it."
              exit 1
            fi
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The runner image already has CocoaPods. Installing it again costs several
      # minutes and can fail on a native extension build, so it is only done if
      # pod is genuinely missing. The version is echoed either way, because the
      # log is the only place a toolchain mismatch would show up.
      - name: Set up CocoaPods
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            echo "pod not on this image, installing it"
            sudo gem install cocoapods --no-document
          fi
          echo "pods: $(pod --version)"
          echo "ruby: $(ruby --version)"
          echo "xcode: $(xcodebuild -version | head -n1)"

      - name: Install dependencies
        run: npm ci

      # expo-modules-jsi does not compile with Xcode 26, which is also the only Xcode
      # it can be built with. Two independent defects, both in the package.
      #
      # 1. Both RuntimeScheduler constructors are annotated SWIFT_RETURNS_RETAINED.
      #    A constructor returns nothing, so the attribute is meaningless, and clang
      #    rejects it: 'RuntimeScheduler' cannot be annotated with either
      #    SWIFT_RETURNS_RETAINED or SWIFT_RETURNS_UNRETAINED because it is not
      #    returning a SWIFT_SHARED_REFERENCE type.
      #
      # 2. Three JSI pointers are captured into a JavaScriptActor closure, and Swift
      #    6.2 region isolation rejects all seven uses with
      #      sending 'thisPtr' risks causing data races
      #    The package's own answer to this is already in its source, next to
      #    CFRunLoopGetCurrent(): "Wrapped in NonisolatedUnsafeVar instead of
      #    nonisolated(unsafe) let to work around a Swift 6.2.3 compiler bug". The
      #    seven failing sites still use the weaker nonisolated(unsafe) let, so this
      #    step applies the package's own idiom to them rather than inventing one.
      #    The sibling setter at line 199 escapes the same diagnostic only because it
      #    moves the pointer out before entering the isolated closure, which confirms
      #    the capture is the sole trigger.
      #
      # There is no version to move to. Every release from 57.0.8 to 58.0.5 declares
      # swift-tools-version 6.2 and carries both defects, and 58.0.5's
      # RuntimeScheduler.h is byte identical to 57.1.1's. Lowering the language mode
      # is not an option either, because the package uses `sending` and
      # `isolated(any)` throughout, and SWIFT_STRICT_CONCURRENCY is ignored once the
      # language mode is 6.
      #
      # Both patches are semantics preserving. Swift only ever calls these as
      # initializers, so a constructor's return annotation is never read, and the
      # SWIFT_SHARED_REFERENCE that tells ARC to call retainRuntimeScheduler and
      # releaseRuntimeScheduler is asserted to have survived. The boxed pointers are
      # read only inside the synchronous call that received them, which is the same
      # guarantee the package already relies on for NonisolatedUnsafeVar.
      #
      # Every rule asserts how many times its text must occur, so a future package
      # update fails the build instead of quietly patching nothing.
      - name: Patch expo-modules-jsi for Xcode 26
        run: |
          set -euo pipefail
          HDR="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h"

          if [ ! -f "$HDR" ]; then
            echo "::error::$HDR is missing, so this patch cannot be applied"
            exit 1
          fi

          N=$(grep -c 'SWIFT_RETURNS_RETAINED RuntimeScheduler' "$HDR" || true)
          N=${N:-0}
          if [ "$N" -ne 2 ]; then
            echo "::error::expected 2 annotated constructors in $HDR, found $N"
            echo "::error::If expo-modules-jsi now builds cleanly on Xcode 26, delete this step."
            exit 1
          fi

          # Written to a temporary file and moved into place rather than with
          # sed -i, because BSD sed and GNU sed disagree about what -i consumes
          # and a wrong guess there edits nothing while reporting success.
          sed -E 's/SWIFT_RETURNS_RETAINED (RuntimeScheduler\()/\1/' "$HDR" > "$HDR.tmp"
          mv "$HDR.tmp" "$HDR"

          if grep -q 'SWIFT_RETURNS_RETAINED' "$HDR"; then
            echo "::error::the annotation is still present after patching"
            exit 1
          fi
          if ! grep -q 'SWIFT_SHARED_REFERENCE' "$HDR"; then
            echo "::error::the shared reference annotation was lost, ARC would leak"
            exit 1
          fi
          echo "patch 1: dropped $N invalid constructor annotations, shared reference kept"

          # Patch 2 is literal replacement, so it runs in Node rather than sed. These
          # search strings contain parentheses and dots, and escaping them for sed is
          # the kind of quiet mistake that yields a build compiling the wrong thing.
          # Node is already on this runner for the build itself.
          node <<'JS'
          const fs = require('fs');
          const path = 'node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptRuntime.swift';
          if (!fs.existsSync(path)) {
            console.log('::error::' + path + ' is missing, so this patch cannot be applied');
            process.exit(1);
          }
          let src = fs.readFileSync(path, 'utf8');

          // [search text, required occurrence count, replacement]
          const rules = [
            ['nonisolated(unsafe) let thisPtr = thisPtr', 2, 'let thisPtrBox = NonisolatedUnsafeVar(thisPtr)'],
            ['nonisolated(unsafe) let argumentsPtr = argumentsPtr', 2, 'let argumentsPtrBox = NonisolatedUnsafeVar(argumentsPtr)'],
            ['nonisolated(unsafe) let resultPtr = resultPtr', 3, 'let resultPtrBox = NonisolatedUnsafeVar(resultPtr)'],
            ['UnsafeMutablePointer(mutating: thisPtr)', 1, 'UnsafeMutablePointer(mutating: thisPtrBox.value!)'],
            ['start: argumentsPtr', 2, 'start: argumentsPtrBox.value'],
            ['JavaScriptUnownedValue(runtime.pointee, thisPtr)', 1, 'JavaScriptUnownedValue(runtime.pointee, thisPtrBox.value!)'],
            ['writeJSIValue(to: resultPtr)', 3, 'writeJSIValue(to: resultPtrBox.value!)'],
          ];

          for (const [from, want, to] of rules) {
            const got = src.split(from).length - 1;
            if (got !== want) {
              console.log('::error::expected ' + want + ' occurrence(s) of [' + from + '], found ' + got);
              console.log('::error::if the package was updated, this patch is stale and must be revisited');
              process.exit(1);
            }
            src = src.split(from).join(to);
          }

          // A half applied patch is worse than none: a box that is declared but
          // never unwrapped would silently change behaviour, and a bare capture
          // left behind would still fail the build with the original diagnostic.
          const leftovers = src.match(/nonisolated\(unsafe\) let (thisPtr|argumentsPtr|resultPtr)/g);
          if (leftovers) {
            console.log('::error::still unpatched captures: ' + leftovers.join(', '));
            process.exit(1);
          }
          const declared = src.match(/let (thisPtrBox|argumentsPtrBox|resultPtrBox) = NonisolatedUnsafeVar/g) || [];
          if (declared.length !== 7) {
            console.log('::error::expected 7 boxed pointers, found ' + declared.length);
            process.exit(1);
          }
          for (const name of ['thisPtrBox', 'argumentsPtrBox', 'resultPtrBox']) {
            if (src.split(name + '.value').length - 1 === 0) {
              console.log('::error::' + name + ' is declared but never read');
              process.exit(1);
            }
          }

          fs.writeFileSync(path, src);
          console.log('patch 2: boxed 7 call scoped pointers, no bare captures left');
          JS

      # The version has to be written into app.json before prebuild runs, because
      # that is the only input prebuild reads. It writes a literal into the
      # generated Info.plist:
      #
      #   CFBundleShortVersionString: config.ios?.version || config.version
      #   CFBundleVersion:            config.ios?.buildNumber || '1'
      #
      # in @expo/config-plugins/build/ios/Version.js. Nothing in that file refers
      # to $(MARKETING_VERSION) or $(CURRENT_PROJECT_VERSION), so passing those to
      # xcodebuild as build settings does nothing. Run 7 passed
      # MARKETING_VERSION=1.0.1 and CURRENT_PROJECT_VERSION=7 and still uploaded
      # 1.0.0 build 1, because app.json declared version 1.0.0 and no buildNumber.
      #
      # The build number is tied to the run number so it always increases, since
      # TestFlight rejects a build number it has already seen. A fixed value in
      # app.json would make every upload after the first one a duplicate.
      #
      # Stamping app.json rather than the generated plist also keeps the Expo
      # runtimeVersion consistent. It is derived from expo.version, so a plist
      # edited behind its back would ship a binary whose update channel is keyed
      # to a version the binary does not report.
      - name: Stamp the version into app.json
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const raw = fs.readFileSync('app.json', 'utf8');
          const cfg = JSON.parse(raw);
          const expo = cfg.expo || (cfg.expo = {});

          const version = process.env.VERSION_NAME;
          const build = process.env.BUILD_NUMBER;
          if (!/^\d+(\.\d+){0,2}$/.test(version)) {
            console.log('::error::versionName must look like 1.0.1, got: ' + version);
            process.exit(1);
          }
          if (!/^[1-9]\d*$/.test(build)) {
            console.log('::error::the build number must be a positive integer, got: ' + build);
            process.exit(1);
          }

          expo.version = version;
          expo.ios = Object.assign({}, expo.ios, { buildNumber: build });
          fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');

          // Read the file back rather than trusting the object in memory, so this
          // asserts what prebuild will actually see on disk.
          const check = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          if (check.expo.version !== version || check.expo.ios.buildNumber !== build) {
            console.log('::error::app.json was written but does not read back as expected');
            process.exit(1);
          }
          console.log('app.json now declares version ' + check.expo.version +
                      ' build ' + check.expo.ios.buildNumber);
          JS

      # ios/ is gitignored, so the Xcode project is generated fresh every run.
      # --clean guarantees the signing settings are never inherited from a
      # previous build, which is the most common cause of a stale-team error.
      # CI is set so prebuild never stops on a prompt it cannot answer.
      - name: Generate the iOS project
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform ios --clean

      - name: Install pods
        run: npx pod-install ios

      - name: Resolve project names
        id: names
        run: |
          set -euo pipefail
          SCHEME=$(node -p "require('./app.json').expo.name.replace(/[^A-Za-z0-9]/g,'')")
          test -d "ios/$SCHEME.xcworkspace" || { echo "::error::ios/$SCHEME.xcworkspace not generated"; exit 1; }
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Found workspace ios/$SCHEME.xcworkspace"

      # A distribution certificate is a one-time export from the Apple Developer
      # portal. It goes into a throwaway keychain, and the keychain is deleted
      # again below so nothing survives on the runner.
      #
      # -allowProvisioningUpdates cannot download a profile on its own: that needs
      # App Store Connect API credentials handed to xcodebuild, which this workflow
      # does not do. The profile is therefore installed here from a secret, and the
      # archive step then signs against it directly. This is the difference between
      # "No profiles for 'com.worktracker.app' were found" and a working build.
      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$PROFILE_BASE64" ]; then
            echo "::error::APPLE_PROVISIONING_PROFILE_BASE64 is not set, so there is no profile to install"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # A .mobileprovision is a CMS signed message with the plist wrapped
          # inside it, not a plist. Reading it directly makes PlistBuddy stop
          # with "Unexpected character 0 at line 1", because byte zero of the
          # file is the DER header 0x30. security cms -D unwraps it first.
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID"          "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name"          "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          EXP=$(/usr/libexec/PlistBuddy -c "Print :ExpirationDate" "$RUNNER_TEMP/profile.plist")
          echo "profile name   $NAME"
          echo "uuid           $UUID"
          echo "team           $TEAM"
          echo "covers         $APPID"
          echo "expires        $EXP"

          # Everything below is checked here rather than left to xcodebuild,
          # which reports a mismatch as a signing error several steps later
          # with none of this context.
          if [ "$TEAM" != "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "::error::profile team '$TEAM' does not match APPLE_TEAM_ID. Fix the secret."
            exit 1
          fi
          if [ "$NAME" != "${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}" ]; then
            echo "::error::profile name '$NAME' does not match APPLE_PROVISIONING_PROFILE_NAME. Fix the secret."
            exit 1
          fi
          if [ "$APPID" != "$TEAM.$APP_BUNDLE_ID" ]; then
            echo "::error::profile covers '$APPID' but this app builds as '$TEAM.$APP_BUNDLE_ID'."
            echo "::error::Either the bundle id in app.json or the profile is wrong. They cannot both be right."
            exit 1
          fi
          # PlistBuddy prints a date as 'Wed Sep 29 08:44:58 UTC 2027', not as ISO, so
          # both shapes are tried. The check stays lenient on purpose: a value
          # that fails to parse must not be mistaken for the epoch, which would
          # report an unexpired profile as expired.
          EXP_EPOCH=''
          for FMT in '%a %b %d %H:%M:%S %Z %Y' '%Y-%m-%dT%H:%M:%SZ'; do
            EXP_EPOCH=$(date -j -f "$FMT" "$EXP" '+%s' 2>/dev/null || echo '')
            [ -n "$EXP_EPOCH" ] && break
          done
          if [ -z "$EXP_EPOCH" ]; then
            echo "::warning::could not parse the expiry '$EXP', leaving it to xcodebuild"
          elif [ "$EXP_EPOCH" -lt "$(date '+%s')" ]; then
            echo "::error::profile expired on $EXP"
            exit 1
          fi

          # Xcode indexes profiles by the UUID in the filename, so the file is
          # named by UUID rather than by the display name the portal shows.
          mv "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed $HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Import the distribution certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=build-ci.keychain
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"

          # security import cannot open a pkcs12 that has no password. It fails
          # with "MAC verification failed during PKCS12 import (wrong password?)"
          # no matter what is passed to -P, because the integrity check needs
          # the password and an empty string is not the same as no password.
          # openssl has no such restriction, so the file is converted to PEM here
          # and the two halves are imported separately.
          #
          # pass: with nothing after it is a genuinely empty password, which is
          # what this .p12 needs. A literal "$CERT_PASSWORD" in the argument
          # would instead be a password consisting of that text.
          if ! openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin "pass:$CERT_PASSWORD" \
               -clcerts -nokeys -out "$RUNNER_TEMP/cert.raw" 2>"$RUNNER_TEMP/p12.err"; then
            echo "::error::openssl could not open the .p12 with the configured password."
            sed 's/^/::error::  /' "$RUNNER_TEMP/p12.err"
            exit 1
          fi
          if ! openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin "pass:$CERT_PASSWORD" \
               -nocerts -nodes -out "$RUNNER_TEMP/key.raw" 2>>"$RUNNER_TEMP/p12.err"; then
            echo "::error::the certificate opened but the private key did not."
            sed 's/^/::error::  /' "$RUNNER_TEMP/p12.err"
            exit 1
          fi

          # openssl writes a friendly name and bag attributes before each BEGIN
          # line. security import wants clean PEM, so everything above the first
          # BEGIN is dropped.
          strip_preamble() {
            awk '/-----BEGIN/{keep=1} keep' "$1" > "$2"
          }
          strip_preamble "$RUNNER_TEMP/cert.raw" "$RUNNER_TEMP/cert.pem"
          strip_preamble "$RUNNER_TEMP/key.raw"  "$RUNNER_TEMP/key.pem"

          if ! grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/key.pem"; then
            echo "::error::the .p12 opened but contains no private key."
            echo "::error::That file is a certificate only, so nothing can be signed with it."
            exit 1
          fi
          openssl pkey -in "$RUNNER_TEMP/key.pem" -noout -check
          echo "private key extracted and structurally valid"

          security import "$RUNNER_TEMP/cert.pem" -k "$KEYCHAIN" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/key.pem"  -k "$KEYCHAIN" -A

          # Without this, codesign cannot see the imported key and the archive
          # fails with "no matching key found" even though the import succeeded.
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # find-identity prints the holder's legal name, which for a public
          # repository is a third party's personal detail in a public build log.
          # The certificate type and team id are kept because they are what makes
          # a mismatch diagnosable, and the name is what is redacted.
          IDENTITIES=$(security find-identity -v -p codesigning || true)
          echo "$IDENTITIES" | sed -E 's/(Distribution: )[^)]*(\(.*\))/\1<name withheld>\2/'
          COUNT=$(echo "$IDENTITIES" | grep -c "Distribution:" || true)
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::no signing identity in the keychain after the import"
            exit 1
          fi
          echo "signing identities: $COUNT"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          CERT_NAME: ${{ secrets.APPLE_DISTRIBUTION_CERT_NAME }}
        run: |
          set -euo pipefail
          SCHEME="${{ steps.names.outputs.scheme }}"
          # MARKETING_VERSION and CURRENT_PROJECT_VERSION are deliberately absent.
          # They look like the right place to control the version, but the
          # generated Info.plist holds literal strings written by prebuild, and
          # nothing references these build settings, so passing them changes
          # nothing. The version is stamped into app.json before prebuild runs,
          # which is the only place the generated plist actually reads from.
          xcodebuild \
            -workspace "ios/$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "build/$SCHEME.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$CERT_NAME" \
            archive

          # The action above must be 'archive', not 'build'. With 'build', xcodebuild
          # accepts -archivePath and then ignores it, prints BUILD SUCCEEDED, and
          # writes no .xcarchive at all. That cost a full run: the failure surfaced
          # three minutes later in the export step as 'archive not found at path',
          # which points at the export step and not at the one that went wrong.
          if [ ! -d "build/$SCHEME.xcarchive" ]; then
            echo "::error::the archive step succeeded but build/$SCHEME.xcarchive does not exist"
            echo "::error::if the xcodebuild action is 'build' rather than 'archive', -archivePath is ignored"
            exit 1
          fi
          echo "archive written to build/$SCHEME.xcarchive"

      - name: Export the .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          SCHEME: ${{ steps.names.outputs.scheme }}
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "build/$SCHEME.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa
          ls -la build/ipa

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build-ci.keychain || true

      # The gate has to name all three of 'true', true and empty.
      #
      # A tag push has no inputs at all, so inputs.upload is empty and has to
      # upload, since tagging exists to release.
      #
      # 'true' and true cover a value that arrived as a boolean and as the string
      # 'true'.
      #
      # Nothing else uploads, and that is the point. Run 7 was dispatched with
      # upload=false and uploaded anyway, because the dispatch API delivers every
      # input as a string, and the string 'false' is truthy in an if condition.
      # So the earlier 'inputs.upload == null || inputs.upload' looked correct and
      # was not. Comparing against the string 'true' as well is what makes an
      # explicit upload=false honoured, which is what the description promises.
      - name: Upload to TestFlight
        if: inputs.upload == null || inputs.upload == true || inputs.upload == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          # altool looks for the key in this well-known location, so it is placed
          # there rather than passed on the command line.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          IPA=$(ls build/ipa/*.ipa | head -n1)
          echo "Uploading $(basename "$IPA")"
          xcrun altool --upload-app \
            --file "$IPA" \
            --type ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      # altool has no internal or external switch. A build it uploads is offered
      # to internal testers automatically, which is why the app looked published
      # while nobody outside the team could install it. Internal testing only
      # reaches people who already have a role in App Store Connect, so inviting
      # anyone is impossible until a build sits in an external group.
      #
      # This step automates the part that can be automated: it finds or creates
      # the external group, adds the build, and submits it to Beta App Review
      # when the app has not cleared external review before.
      #
      # It deliberately does not invite testers and does not touch the public
      # link. Both are one click in App Store Connect, and a public link hands a
      # copy of the app to anyone holding the URL, which is a decision to make on
      # purpose rather than a side effect of a CI run.
      #
      # Apple's Beta App Review is a human gate on the first external build and
      # cannot be automated away. Later builds in an already reviewed group reach
      # the testers directly, which is why the submission is conditional on
      # whether any build in the group has already cleared review.
      #
      # The build number is the run number, stamped into app.json before prebuild,
      # so the build is located by that. The builds endpoint filters on the build
      # number and not on the marketing version, and matching on the version
      # would be guesswork.
      - name: Add the build to the external TestFlight group
        if: inputs.upload == null || inputs.upload == true || inputs.upload == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          GROUP_NAME: External
        run: |
          set -euo pipefail
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          if [ ! -f "$KEY_FILE" ]; then
            echo "::error::$KEY_FILE is missing, so the upload step did not run"
            exit 1
          fi

          node <<'JS'
          const fs = require('fs');
          const crypto = require('crypto');

          // The base URL is overridable only so this step can be exercised
          // against a mock. It is not set by the workflow.
          const API = process.env.ASC_API || 'https://api.appstoreconnect.apple.com';
          const KEY_ID = process.env.KEY_ID;
          const ISSUER_ID = process.env.ISSUER_ID;
          const BUILD_NUMBER = process.env.BUILD_NUMBER;
          const GROUP_NAME = process.env.GROUP_NAME;
          const BUNDLE_ID = process.env.APP_BUNDLE_ID;
          const KEY_FILE = process.env.HOME + '/.appstoreconnect/private_keys/AuthKey_' + KEY_ID + '.p8';

          // Terminal states. Retrying cannot improve these.
          const DEAD = ['FAILED', 'INVALID', 'REJECTED'];
          // Any of these mean external review has already been cleared for the
          // app, so a new build in that group needs no fresh submission.
          const CLEARED = ['IN_BETA_TESTING', 'IN_BETA_REVIEW', 'IN_BETA_APPROVAL',
                           'WAITING_FOR_BETA_REVIEW', 'READY_FOR_BETA_SUBMISSION'];

          const b64u = (b) => Buffer.from(b).toString('base64')
            .replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');

          // Apple caps a token at 20 minutes and rejects longer ones with a bare
          // 401. It is cached because the poll below makes many calls.
          let cached = null;
          function token() {
            if (cached && Date.now() < cached.until) return cached.value;
            let key;
            try {
              key = fs.readFileSync(KEY_FILE, 'utf8');
            } catch (e) {
              throw new Error('the API key at ' + KEY_FILE + ' could not be read: ' + e.message);
            }
            const now = Math.floor(Date.now() / 1000);
            const signingInput = b64u(JSON.stringify({ alg: 'ES256', kid: KEY_ID, typ: 'JWT' })) + '.' +
              b64u(JSON.stringify({ iss: ISSUER_ID, iat: now, exp: now + 900 }));
            // ieee-p1363 is the raw 64 byte r||s form JOSE requires. The default
            // is DER wrapped, which Apple answers with 401 and no explanation.
            let sig;
            try {
              sig = crypto.sign('sha256', Buffer.from(signingInput), { key: key, dsaEncoding: 'ieee-p1363' });
            } catch (e) {
              // OpenSSL's own message here is things like "DECODER routines::
              // unsupported", which names neither the key nor the cause. The two
              // realistic causes are a truncated secret, which happens when a
              // multi line value is pasted through something that collapses
              // newlines, and a key that is not a P-256 private key at all.
              throw new Error('the API key at ' + KEY_FILE + ' is not a usable P-256 key (' +
                e.message + '). If it was pasted through a text box, the newlines may ' +
                'have been stripped, and the secret needs setting again as a base64 ' +
                'value rather than as the raw key text.');
            }
            cached = { value: signingInput + '.' + b64u(sig), until: Date.now() + 10 * 60 * 1000 };
            return cached.value;
          }

          // Every failure prints Apple's own status and message. A 403 here means
          // the API key lacks a role, and a 409 on the review submission usually
          // means Beta App Information has not been filled in yet. Those two look
          // identical without the response body, so it is never swallowed.
          async function api(method, path, body) {
            const res = await fetch(API + path, {
              method: method,
              headers: { Authorization: 'Bearer ' + token(), 'Content-Type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const text = await res.text();
            let parsed = null;
            try { parsed = text ? JSON.parse(text) : null; } catch (e) { /* not json */ }
            if (!res.ok) {
              const err = new Error(method + ' ' + path + ' returned ' + res.status);
              err.status = res.status;
              err.body = (parsed && parsed.errors)
                ? JSON.stringify(parsed.errors)
                : text.slice(0, 900);
              throw err;
            }
            return parsed;
          }

          // The poll interval is overridable only so this step can be exercised
          // without waiting a minute per poll. It is not set by the workflow.
          const POLL_MS = Number(process.env.ASC_POLL_MS || 60000);
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function run() {
            const apps = await api('GET', '/v1/apps?filter[bundleId]=' +
              encodeURIComponent(BUNDLE_ID) + '&limit=1');
            if (!apps.data || apps.data.length !== 1) {
              throw new Error('expected exactly one app for bundle id ' + BUNDLE_ID +
                ', found ' + ((apps.data && apps.data.length) || 0));
            }
            const appId = apps.data[0].id;
            console.log('app ' + BUNDLE_ID + ' is ' + appId);

            const listed = await api('GET', '/v1/betaGroups?filter[app]=' + appId + '&limit=200');
            const all = listed.data || [];
            console.log('beta groups: ' + all.length + (all.length ? ' (' + all.map(
              (g) => (g.attributes.isInternalGroup ? 'internal' : 'external') +
                ' "' + g.attributes.name + '"').join(', ') + ')' : ''));

            let group = all.find((g) => g.attributes.isInternalGroup === false &&
                                       g.attributes.name === GROUP_NAME);
            if (group) {
              console.log('reusing external group ' + group.id);
            } else {
              console.log('no external group named "' + GROUP_NAME + '", creating it');
              const made = await api('POST', '/v1/betaGroups', { data: {
                attributes: { name: GROUP_NAME, isInternalGroup: false },
                relationships: { app: { data: { type: 'apps', id: appId } } },
              }});
              group = made.data;
              console.log('created external group ' + group.id);
            }

            // Whether review has been cleared is read from the group, not
            // assumed, so the first run submits and later runs do not.
            const existing = await api('GET', '/v1/betaGroups/' + group.id +
              '/builds?limit=200&fields[builds]=version,processingState');
            const cleared = (existing.data || []).some(
              (b) => CLEARED.indexOf(b.attributes.processingState) !== -1);
            console.log('builds already in the group: ' + (existing.data || []).length +
              ', external review already cleared: ' + cleared);

            console.log('waiting for build ' + BUILD_NUMBER + ' to finish processing');
            let build = null;
            for (let i = 0; i < 20; i++) {
              const found = await api('GET', '/v1/builds?filter[app]=' + appId +
                '&filter[version]=' + encodeURIComponent(BUILD_NUMBER) + '&limit=10');
              const list = found.data || [];
              if (list.length > 0) {
                build = list[0];
                const state = build.attributes.processingState;
                if (DEAD.indexOf(state) !== -1) {
                  throw new Error('build ' + BUILD_NUMBER + ' is ' + state +
                    ', which will not improve on its own. Check it in App Store Connect.');
                }
                if (state !== 'PROCESSING' && state !== 'UPLOADED') {
                  console.log('build ' + build.id + ' is ' + state);
                  break;
                }
                console.log('  still ' + state + ', waiting');
              } else {
                console.log('  not visible yet, waiting');
              }
              await sleep(POLL_MS);
            }
            if (!build) {
              throw new Error('build ' + BUILD_NUMBER + ' never appeared in App Store Connect');
            }

            try {
              await api('POST', '/v1/betaGroups/' + group.id + '/relationships/builds',
                { data: [{ type: 'builds', id: build.id }] });
              console.log('added build ' + build.id + ' to the external group');
            } catch (e) {
              // 409 or 422 here means it is already in the group, which is the
              // state being aimed for and happens on every re-run.
              if (e.status === 409 || e.status === 422) {
                console.log('build ' + build.id + ' was already in the group: ' + e.body);
              } else {
                throw e;
              }
            }

            if (cleared) {
              console.log('external review was already cleared, so this build reaches the ' +
                'testers directly and needs no new submission');
            } else {
              console.log('this app has not cleared external review yet, submitting the build');
              try {
                const sub = await api('POST', '/v1/betaAppReviewSubmissions', { data: {
                  relationships: { build: { data: { type: 'builds', id: build.id } } },
                }});
                console.log('beta review submission ' + (sub.data && sub.data.id) + ' created');
              } catch (e) {
                if (e.status === 409) {
                  // A 409 here has two causes that this cannot tell apart: a
                  // submission already exists for this build, or Beta App
                  // Information has not been filled in. Both are left non fatal
                  // because the build is already in the group either way, but the
                  // cause is not guessed at, since saying "already submitted" when
                  // the real problem is missing beta info sends the reader to the
                  // wrong page.
                  console.log('the submission was not accepted, status 409: ' + e.body);
                  console.log('this is either a submission that already exists, or Beta App');
                  console.log('Information that is still empty under TestFlight. Both are');
                  console.log('fixed by hand in App Store Connect, not by rerunning this.');
                } else {
                  throw e;
                }
              }
            }

            const after = await api('GET', '/v1/builds/' + build.id +
              '?fields[builds]=processingState,version,expired');
            const state = after.data.attributes.processingState;
            console.log('build ' + BUILD_NUMBER + ' is now ' + state);
            if (state !== 'IN_BETA_TESTING') {
              console.log('');
              console.log('External testers cannot install this build until Apple approves it.');
              console.log('Beta App Review is a human step and only the first external build');
              console.log('needs it. Watch it under TestFlight, then add people to the "' +
                GROUP_NAME + '" group or enable its public link.');
            }
          }

          run().catch((e) => {
            console.log('::error::' + e.message);
            if (e.body) console.log('::error::Apple said: ' + e.body);
            console.log('::error::the build is uploaded and safe in TestFlight. Only the');
            console.log('::error::external distribution did not happen, so a failure here');
            console.log('::error::does not invalidate the build.');
            // Setting the code and letting the loop drain, rather than exiting
            // outright. A hard exit while a fetch socket is still open tears the
            // process down mid handshake, which printed a libuv assertion and
            // turned a clean exit 1 into 127. The socket is closed explicitly so
            // the drain cannot wait on Apple's keep alive window, and the timer
            // is a backstop so a wedged handle still ends the step.
            if (globalThis[Symbol.for('undici.globalDispatcher.1')] &&
                globalThis[Symbol.for('undici.globalDispatcher.1')].close) {
              globalThis[Symbol.for('undici.globalDispatcher.1')].close();
            }
            process.exitCode = 1;
            setTimeout(() => process.exit(1), 3000).unref();
          });
          JS

      - name: Upload the .ipa as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-tracker-ipa
          path: build/ipa/*.ipa
          retention-days: 30
